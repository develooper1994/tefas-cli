[package]
name = "http-client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
reqwest = { workspace = true }
wreq = { workspace = true, optional = true }
http = { workspace = true }
url = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
hyper-rustls = { workspace = true, optional = true }
hyper-tls = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tracing = { workspace = true }
dirs = { workspace = true }
http-config = { workspace = true }
tefas-config = { workspace = true, optional = true }

[features]
default = ["hyper-backend", "wreq-backend", "tefas-compat"]
tefas-compat = ["dep:tefas-config"]
native-tls = ["reqwest/native-tls-vendored", "dep:hyper-tls"]
hyper-backend = ["dep:hyper", "dep:hyper-util", "dep:hyper-rustls", "dep:http-body-util", "dep:bytes", "dep:rustls"]
wreq-backend = ["dep:wreq"]
