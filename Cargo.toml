[workspace]
members = [
    "xtask",
    "crates/core",
    "crates/domain",
    "crates/usecase",
    "crates/network",
    "crates/api",
    "crates/parser",
    "crates/lib",
    "crates/ffi",
    "crates/cli",
    "crates/tools",
    "crates/media",
]
default-members = [
    "crates/cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
description = "Standalone Rust workspace for TEFAS data collection and CLI tooling"
keywords = ["tefas", "takasbank", "finance", "cli", "fund"]
categories = ["command-line-utilities", "web-programming::http-client"]

[workspace.dependencies]
aho-corasick = "1.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
wreq = { version = "5.3.0", features = ["cookies", "gzip", "brotli"] }
http = "1"
url = "2"
hyper-tls = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1", "http2"] }
hyper-rustls = { version = "0.27", features = ["http1", "http2", "ring", "native-tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", features = ["ring"] }
once_cell = "1.21"
regex = "1.7"
tracing = "0.1"
dirs = "5"
criterion = { version = "0.5", features = ["html_reports"] }
flate2 = "1"
libfuzzer-sys = "0.4"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = { version = "0.5", features = ["util"] }

http-config = { path = "crates/http-config" }
http-client = { path = "crates/http-client", default-features = false }
image-util = { path = "crates/image-util" }
tefas-config = { package = "config", path = "crates/core" }
tefas-domain = { package = "domain", path = "crates/domain" }
tefas-usecase = { package = "usecase", path = "crates/usecase" }
tefas-network = { package = "network", path = "crates/network", default-features = false }
tefas-api = { package = "api", path = "crates/api", default-features = false }
tefas-parser = { package = "parser", path = "crates/parser" }
tefas-media = { package = "media", path = "crates/media" }
tefas = { package = "lib", path = "crates/lib", default-features = false }
tefas-tools = { package = "tools", path = "crates/tools" }