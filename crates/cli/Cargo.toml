[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[features]
default = ["tefas-compat", "hyper-backend", "wreq-backend"]
tefas-compat = ["tefas/tefas-compat"]
native-tls = ["tefas/native-tls"]
hyper-backend = ["tefas/hyper-backend"]
wreq-backend = ["tefas/wreq-backend"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
tefas = { workspace = true, default-features = false }
tefas-tools = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "fundpage_pipeline_bench"
harness = false
